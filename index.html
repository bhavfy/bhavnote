<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bhavnote · Studio notebook</title>
<meta name="description" content="Bhavnote is a private studio notebook for an independent video editor. Notes, ideas, YouTube references, editing lab and clients, saved only on this device.">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bhavnote">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css?v=2">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3h9l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v5h5M8.5 12.5h7M8.5 16.5h5"/></symbol>
    <symbol id="i-idea" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.7.6 1.1 1.3 1.1 2.2h5c0-.9.4-1.6 1.1-2.2A6 6 0 0 0 12 3z"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="4"/><path d="m10 9.2 5 2.8-5 2.8z"/></symbol>
    <symbol id="i-lab" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.2L4.6 18.4A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.4-2.6L14 9.2V3M7.2 15h9.6"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.4 3.2-5.5 6.5-5.5s5.9 2.1 6.5 5.5M16 4.8a3.5 3.5 0 0 1 0 6.4M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.1.8-4.5 4.3 1.1 6.1L12 16.9l-5.4 2.9 1.1-6.1-4.5-4.3 6.1-.8z"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>

<a class="skip" href="#view">Skip to content</a>

<div class="shell">
  <aside class="sidebar" aria-label="Main">
    <a class="brand" href="#/dashboard" aria-label="Bhavnote home">
      <img src="icons/icon-192.png" alt="" width="34" height="34">
      <span class="brand-text"><strong>Bhavnote</strong><small id="sideStudio">Studio notebook</small></span>
    </a>
    <button class="search-trigger" type="button" data-action="search">
      <svg class="ic"><use href="#i-search"/></svg><span>Search</span><kbd id="kbdHint">Ctrl K</kbd>
    </button>
    <button class="btn btn-primary side-new" type="button" data-action="new">
      <svg class="ic"><use href="#i-plus"/></svg>New entry
    </button>
    <nav class="side-nav" aria-label="Sections">
      <a href="#/dashboard" data-route="dashboard"><svg class="ic"><use href="#i-home"/></svg>Dashboard</a>
      <a href="#/notes" data-route="notes"><svg class="ic"><use href="#i-note"/></svg>Notes<span class="count" data-count="note"></span></a>
      <a href="#/ideas" data-route="ideas"><svg class="ic"><use href="#i-idea"/></svg>Ideas<span class="count" data-count="idea"></span></a>
      <a href="#/youtube" data-route="youtube"><svg class="ic"><use href="#i-play"/></svg>YouTube Store<span class="count" data-count="video"></span></a>
      <a href="#/lab" data-route="lab"><svg class="ic"><use href="#i-lab"/></svg>Editing Lab<span class="count" data-count="lab"></span></a>
      <a href="#/clients" data-route="clients"><svg class="ic"><use href="#i-users"/></svg>Clients<span class="count" data-count="client"></span></a>
      <div class="side-sep" role="presentation"></div>
      <a href="#/favorites" data-route="favorites"><svg class="ic"><use href="#i-star"/></svg>Favorites<span class="count" data-count="fav"></span></a>
      <a href="#/settings" data-route="settings"><svg class="ic"><use href="#i-gear"/></svg>Settings</a>
    </nav>
    <p class="side-foot"><span class="dot-live" aria-hidden="true"></span>Saved on this device only</p>
  </aside>

  <header class="topbar">
    <a class="brand" href="#/dashboard" aria-label="Bhavnote home">
      <img src="icons/icon-192.png" alt="" width="30" height="30">
      <strong id="topTitle">Bhavnote</strong>
    </a>
    <div class="top-actions">
      <button class="icon-btn" type="button" data-action="search" aria-label="Search"><svg class="ic"><use href="#i-search"/></svg></button>
      <a class="icon-btn" href="#/favorites" aria-label="Favorites" data-route="favorites"><svg class="ic"><use href="#i-star"/></svg></a>
      <a class="icon-btn" href="#/settings" aria-label="Settings" data-route="settings"><svg class="ic"><use href="#i-gear"/></svg></a>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>
</div>

<nav class="bottomnav" aria-label="Sections">
  <a href="#/dashboard" data-route="dashboard"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></a>
  <a href="#/notes" data-route="notes"><svg class="ic"><use href="#i-note"/></svg><span>Notes</span></a>
  <a href="#/ideas" data-route="ideas"><svg class="ic"><use href="#i-idea"/></svg><span>Ideas</span></a>
  <a href="#/youtube" data-route="youtube"><svg class="ic"><use href="#i-play"/></svg><span>Videos</span></a>
  <a href="#/lab" data-route="lab"><svg class="ic"><use href="#i-lab"/></svg><span>Lab</span></a>
  <a href="#/clients" data-route="clients"><svg class="ic"><use href="#i-users"/></svg><span>Clients</span></a>
</nav>

<button class="fab" type="button" data-action="fab" aria-label="New entry"><svg class="ic"><use href="#i-plus"/></svg></button>

<dialog id="editor" class="sheet" aria-labelledby="editorTitle">
  <form id="editorForm" method="dialog" novalidate>
    <header class="sheet-head">
      <div><p class="eyebrow" id="editorType">Note</p><h2 id="editorTitle">New note</h2></div>
      <button class="icon-btn" type="button" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
    </header>
    <div class="sheet-body" id="editorFields"></div>
    <footer class="sheet-foot">
      <button class="btn btn-danger-ghost" type="button" id="editorDelete"><svg class="ic"><use href="#i-trash"/></svg>Delete</button>
      <span class="grow"></span>
      <button class="btn btn-ghost" type="button" data-close>Cancel</button>
      <button class="btn btn-primary" type="submit" id="editorSave">Save</button>
    </footer>
  </form>
</dialog>

<dialog id="searchDlg" class="palette" aria-label="Search everything">
  <div class="palette-input">
    <svg class="ic"><use href="#i-search"/></svg>
    <input id="searchInput" type="text" enterkeyhint="search" placeholder="Search notes, ideas, videos, lab, clients…" autocomplete="off" aria-label="Search everything" aria-controls="searchResults">
    <button class="icon-btn" type="button" data-close aria-label="Close search"><svg class="ic"><use href="#i-x"/></svg></button>
  </div>
  <ul id="searchResults" class="palette-results" role="listbox" aria-label="Results"></ul>
  <p class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></p>
</dialog>

<dialog id="chooser" class="sheet small" aria-labelledby="chooserTitle">
  <header class="sheet-head">
    <div><p class="eyebrow">Create</p><h2 id="chooserTitle">What are you adding?</h2></div>
    <button class="icon-btn" type="button" data-close aria-label="Close"><svg class="ic"><use href="#i-x"/></svg></button>
  </header>
  <div class="chooser-grid" id="chooserGrid"></div>
</dialog>

<dialog id="confirmDlg" class="sheet small" aria-labelledby="confirmTitle">
  <div class="confirm-body">
    <h2 id="confirmTitle">Are you sure?</h2>
    <p id="confirmMsg"></p>
  </div>
  <footer class="sheet-foot" id="confirmActions"></footer>
</dialog>

<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="app.js?v=2"></script>
</body>
</html>
